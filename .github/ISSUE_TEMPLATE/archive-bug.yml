name: Archive or tooling defect
description: Report a broken path, inconsistent evidence claim, or packaging failure.
title: "archive: "
body:
  - type: input
    id: milestone
    attributes:
      label: Affected milestone or command
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and supporting evidence
      description: Include the exact command, error, or conflicting source reference. Remove tokens and personal secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
