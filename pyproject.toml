[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vcc-milestones"
version = "0.1.0"
description = "Data-free verification and release tooling for an evidence-backed perturbation research archive"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vcc-milestones = "vcc_milestones.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
